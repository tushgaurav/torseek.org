services:
  # Optional local Jackett for development: `docker compose --profile jackett up -d`.
  # Production runs its own Jackett outside this stack; see JACKETT_URL on api.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: torseek-jackett
    restart: unless-stopped
    profiles: ["jackett"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      AUTO_UPDATE: "true"
    volumes:
      - jackett-config:/config
    # Loopback only: Jackett's API key grants full admin access, so the UI/API
    # must never be reachable from outside this machine.
    ports:
      - "127.0.0.1:9117:9117"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9117/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: solves Cloudflare challenges for indexers that need it.
  # Start with `docker compose --profile flaresolverr up -d`, then set
  # "FlareSolverr API URL" to http://flaresolverr:8191 in Jackett settings.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: torseek-flaresolverr
    restart: unless-stopped
    profiles: ["flaresolverr"]
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}

  # Production: `docker compose --profile prod up -d`. Jackett runs separately
  # on the host; the container reaches it through host.docker.internal, which
  # extra_hosts maps to the Docker bridge gateway on Linux. Override JACKETT_URL
  # in the root .env if Jackett lives elsewhere.
  api:
    # `--build` locally tags the result torseek-api:local. CI writes API_IMAGE
    # (the GHCR tag it pushed) into the VM's root .env and runs `up --no-build`.
    image: ${API_IMAGE:-torseek-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: torseek-api
    restart: unless-stopped
    profiles: ["prod"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JACKETT_URL: ${JACKETT_URL:-http://host.docker.internal:9117}
      # Read from the shell or a root .env; the API refuses to start without it.
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      REQUIRE_JACKETT: "true"
      JACKETT_TIMEOUT_MS: ${JACKETT_TIMEOUT_MS:-30000}
      SEARCH_CACHE_TTL_MS: ${SEARCH_CACHE_TTL_MS:-600000}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"

  # Production: TLS termination and reverse proxy for API_DOMAIN (set in the
  # root .env). Ports 80/443 must be open in the instance's security group.
  caddy:
    image: caddy:2-alpine
    container_name: torseek-caddy
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - api
    environment:
      # Falls back to localhost (self-signed) so the file still validates when
      # the prod profile is inactive.
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  jackett-config:
  caddy-data:
  caddy-config:
